openapi: 3.0.0
info:
  title: 'CarryCaro API'
  description: 'API documentation for CarryCaro authentication, profile, locations, and trips.'
  version: 1.0.0
servers:
  -
    url: /
    description: 'Current application'
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: 'Register a new user'
      operationId: dca5bdd60525f15e67774e780d94b18c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: 'Jane Doe'
                  maxLength: 255
                email:
                  type: string
                  format: email
                  example: jane@example.com
                  maxLength: 255
                password:
                  type: string
                  format: password
                  example: password123
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  example: password123
                phone_number:
                  type: string
                  example: '+491234567890'
                  nullable: true
                  maxLength: 20
                facebook_profile:
                  type: string
                  nullable: true
                  maxLength: 255
              type: object
      responses:
        201:
          description: 'Registration successful'
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                type: object
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 'Log in with email and password'
      operationId: 961daabd832c20e87b5f5a7091969594
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  format: password
                  example: password123
              type: object
      responses:
        200:
          description: 'Login successful'
          content:
            application/json:
              schema:
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                type: object
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/auth/social-login:
    post:
      tags:
        - Auth
      summary: 'Log in or register with a Google ID token'
      description: 'Mobile-only Google sign-in. The API verifies the supplied Google ID token with Google before creating or updating the user.'
      operationId: googleSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        200:
          description: 'Social login successful'
          content:
            application/json:
              schema:
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                type: object
        422:
          description: 'Validation failed, invalid Google token, unverified email, or disallowed Google OAuth audience'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 'Revoke the current access token'
      operationId: 54f0e393c0452584096da838297de41d
      responses:
        200:
          description: 'Logout successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        401:
          description: Unauthenticated
      security:
        -
          sanctum: []
  /api/cities:
    get:
      tags:
        - Locations
      summary: 'Search cities'
      operationId: c20a201333ececa79c9050d00b70f74a
      parameters:
        -
          name: search
          in: query
          required: false
          schema:
            type: string
        -
          name: q
          in: query
          description: 'Alias for search'
          required: false
          schema:
            type: string
        -
          name: country_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          description: 'City list'
          content:
            application/json:
              schema:
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                type: object
  /api/countries:
    get:
      tags:
        - Locations
      summary: 'List countries'
      operationId: 0bc911aa73e4b71ab5184661e2e4cc32
      parameters:
        -
          name: search
          in: query
          required: false
          schema:
            type: string
        -
          name: q
          in: query
          description: 'Alias for search'
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Country list'
          content:
            application/json:
              schema:
                properties:
                  countries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
                type: object
  /api/profile:
    get:
      tags:
        - Profile
      summary: "Get the authenticated user's profile"
      operationId: 6f7a44d794e4ee2f0dd41e07672e05a8
      responses:
        200:
          description: 'Authenticated profile'
          content:
            application/json:
              schema:
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                type: object
        401:
          description: Unauthenticated
      security:
        -
          sanctum: []
    put:
      tags:
        - Profile
      summary: "Update the authenticated user's profile"
      operationId: 366e8685c9e76451738e8571d5d6267a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 255
                phone_number:
                  type: string
                  nullable: true
                  maxLength: 20
                facebook_profile:
                  type: string
                  nullable: true
                  maxLength: 255
                timezone:
                  type: string
                  nullable: true
                  maxLength: 50
                password:
                  type: string
                  format: password
                  nullable: true
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  nullable: true
              type: object
      responses:
        200:
          description: 'Profile updated'
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                type: object
        401:
          description: Unauthenticated
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Profile
      summary: "Delete the authenticated user's account"
      operationId: 4a00b2f0ae820fb71171ceac53dbf4ac
      responses:
        200:
          description: 'Account deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        401:
          description: Unauthenticated
      security:
        -
          sanctum: []
  /api/trips:
    get:
      tags:
        - Trips
      summary: 'Browse public trips'
      operationId: ff4f880f8f46fe602ff226c0bfde6961
      parameters:
        -
          name: from_city_id
          in: query
          required: false
          schema:
            type: integer
        -
          name: to_city_id
          in: query
          required: false
          schema:
            type: integer
        -
          name: departure_from
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: departure_to
          in: query
          required: false
          schema:
            type: string
            format: date
        -
          name: include_past
          in: query
          required: false
          schema:
            type: boolean
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
      responses:
        200:
          description: 'Paginated trip list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrips'
    post:
      tags:
        - Trips
      summary: 'Create a trip'
      operationId: 45dc9dfd1bf50d858ba8bd9387fbba29
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripWriteRequest'
      responses:
        201:
          description: 'Trip created'
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  trip:
                    $ref: '#/components/schemas/Trip'
                type: object
        401:
          description: Unauthenticated
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        -
          sanctum: []
  /api/my-trips:
    get:
      tags:
        - Trips
      summary: "List authenticated user's trips"
      operationId: 6fe46b991ba199ce63c1e65f2255c58d
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
            minimum: 1
      responses:
        200:
          description: 'Paginated trip list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrips'
        401:
          description: Unauthenticated
      security:
        -
          sanctum: []
  '/api/trips/{trip}':
    get:
      tags:
        - Trips
      summary: 'Show a trip'
      operationId: 291c8a839ea2ee7b5f2ea1dc857b8ac0
      parameters:
        -
          name: trip
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Trip details'
          content:
            application/json:
              schema:
                properties:
                  trip:
                    $ref: '#/components/schemas/Trip'
                type: object
        404:
          description: 'Not found'
    put:
      tags:
        - Trips
      summary: "Update one of the authenticated user's trips"
      operationId: c3c712cfe93414b2efc973823df33010
      parameters:
        -
          name: trip
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripWriteRequest'
      responses:
        200:
          description: 'Trip updated'
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  trip:
                    $ref: '#/components/schemas/Trip'
                type: object
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Trips
      summary: "Delete one of the authenticated user's trips"
      operationId: 04af5b5837e5c485350d413673b33616
      parameters:
        -
          name: trip
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Trip deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
components:
  schemas:
    MessageResponse:
      required:
        - message
      properties:
        message:
          type: string
          example: 'Operation completed successfully.'
      type: object
    ValidationErrorResponse:
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: 'The given data was invalid.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
    User:
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Jane Doe'
        email:
          type: string
          format: email
          example: jane@example.com
        phone_number:
          type: string
          example: '+491234567890'
          nullable: true
        facebook_profile:
          type: string
          example: 'https://facebook.com/jane'
          nullable: true
        profile_image:
          type: string
          example: 'https://example.com/avatar.jpg'
          nullable: true
        timezone:
          type: string
          example: Europe/Berlin
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      type: object
    Country:
      required:
        - id
        - name
        - code
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Germany
        code:
          type: string
          example: DE
          nullable: true
      type: object
    City:
      required:
        - id
        - name
        - country
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Berlin
        city_type:
          type: string
          example: capital
          nullable: true
        country:
          $ref: '#/components/schemas/Country'
      type: object
    Trip:
      required:
        - id
        - from_city
        - to_city
        - departure_date
        - arrival_date
        - weight_available
        - weight_price
      properties:
        id:
          type: integer
          example: 10
        from_city:
          $ref: '#/components/schemas/City'
        to_city:
          $ref: '#/components/schemas/City'
        user:
          $ref: '#/components/schemas/User'
        departure_date:
          type: string
          format: date
          example: '2026-06-15'
        arrival_date:
          type: string
          format: date
          example: '2026-06-16'
        airline:
          type: string
          example: Lufthansa
          nullable: true
        notes:
          type: string
          example: 'Can carry fragile items with proper packaging.'
          nullable: true
        weight_available:
          type: number
          example: 5
        weight_price:
          type: string
          example: 'EUR 12/kg'
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      type: object
    TripWriteRequest:
      required:
        - from_city_id
        - to_city_id
        - departure_date
        - arrival_date
        - weight_available
        - weight_price
      properties:
        from_city_id:
          type: integer
          example: 1
        to_city_id:
          type: integer
          example: 2
        departure_date:
          type: string
          format: date
          example: '2026-06-15'
        arrival_date:
          type: string
          format: date
          example: '2026-06-16'
        weight_available:
          type: number
          example: 5
          minimum: 0.1
        weight_price:
          type: string
          example: 'EUR 12/kg'
          maxLength: 255
        airline:
          type: string
          example: Lufthansa
          nullable: true
          maxLength: 255
        notes:
          type: string
          example: 'Can carry fragile items with proper packaging.'
          nullable: true
          maxLength: 1000
      type: object
    GoogleSignInRequest:
      required:
        - provider
        - id_token
      properties:
        provider:
          type: string
          example: google
          enum:
            - google
        id_token:
          description: 'Google ID token returned by the Android or iOS Google Sign-In SDK.'
          type: string
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
      type: object
    PaginatedTrips:
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        links:
          type: object
        meta:
          type: object
      type: object
  securitySchemes:
    sanctum:
      type: http
      bearerFormat: 'Sanctum token'
      scheme: bearer
tags:
  -
    name: Auth
    description: Auth
  -
    name: Locations
    description: Locations
  -
    name: Profile
    description: Profile
  -
    name: Trips
    description: Trips
