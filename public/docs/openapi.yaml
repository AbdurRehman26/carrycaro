openapi: 3.0.3
info:
  title: CarryCaro API
  version: 1.0.0
  description: API documentation for CarryCaro authentication, profile, cities, countries, and trips.
servers:
  - url: /api
    description: Current API server
tags:
  - name: Auth
    description: Registration, login, social login, and logout.
  - name: Profile
    description: Authenticated user profile management.
  - name: Locations
    description: Cities and countries lookup endpoints.
  - name: Trips
    description: Trip browsing and authenticated trip management.
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/social-login:
    post:
      tags: [Auth]
      summary: Log in or register with a social provider
      description: Accepts a provider identity from a trusted mobile or frontend social-auth flow.
      operationId: socialLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      responses:
        '200':
          description: Social login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      operationId: logout
      security:
        - sanctum: []
      responses:
        '200':
          description: Logout successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /cities:
    get:
      tags: [Locations]
      summary: Search cities
      operationId: listCities
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter cities by partial name.
        - name: country_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter cities by country id.
      responses:
        '200':
          description: City list. Results are limited to 50 records.
          content:
            application/json:
              schema:
                type: object
                required: [cities]
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
  /countries:
    get:
      tags: [Locations]
      summary: List countries
      operationId: listCountries
      responses:
        '200':
          description: Country list ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
  /trips:
    get:
      tags: [Trips]
      summary: Browse public trips
      operationId: listTrips
      parameters:
        - name: from_city_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by departure city id.
        - name: to_city_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by arrival city id.
        - name: departure_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Include trips departing on or after this date.
        - name: departure_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Include trips departing on or before this date.
        - name: include_past
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include past trips when true.
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated trip list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrips'
    post:
      tags: [Trips]
      summary: Create a trip
      operationId: createTrip
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
      responses:
        '201':
          description: Trip created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{trip}:
    get:
      tags: [Trips]
      summary: Show a trip
      operationId: showTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip details.
          content:
            application/json:
              schema:
                type: object
                required: [trip]
                properties:
                  trip:
                    $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Trips]
      summary: Update one of the authenticated user's trips
      operationId: updateTrip
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdateRequest'
      responses:
        '200':
          description: Trip updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Trips]
      summary: Delete one of the authenticated user's trips
      operationId: deleteTrip
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /my-trips:
    get:
      tags: [Trips]
      summary: List authenticated user's trips
      operationId: listMyTrips
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list of the authenticated user's trips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrips'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /profile:
    get:
      tags: [Profile]
      summary: Get the authenticated user's profile
      operationId: getProfile
      security:
        - sanctum: []
      responses:
        '200':
          description: Authenticated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [Profile]
      summary: Update the authenticated user's profile
      operationId: updateProfile
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Profile]
      summary: Delete the authenticated user's account
      operationId: deleteProfile
      security:
        - sanctum: []
      responses:
        '200':
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Page number.
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 15
      description: Number of records per page.
    TripId:
      name: trip
      in: path
      required: true
      schema:
        type: integer
      description: Trip id.
  responses:
    Unauthenticated:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthorized.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Not Found
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        message:
          type: string
          nullable: true
          example: Registration successful. Please verify your email.
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: 1|plain-text-token
    City:
      type: object
      required: [id, name, country]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Berlin
        city_type:
          type: string
          nullable: true
          example: capital
        country:
          $ref: '#/components/schemas/CountrySummary'
    Country:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Germany
        code:
          type: string
          nullable: true
          example: DE
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    CountrySummary:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          nullable: true
          example: Germany
        code:
          type: string
          nullable: true
          example: DE
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Unauthenticated.
    LaravelPaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    LaravelPaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          nullable: true
          example: 1
        last_page:
          type: integer
          example: 1
        path:
          type: string
          example: http://localhost/api/trips
        per_page:
          type: integer
          example: 15
        to:
          type: integer
          nullable: true
          example: 1
        total:
          type: integer
          example: 1
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Operation completed successfully.
    PaginatedTrips:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        links:
          $ref: '#/components/schemas/LaravelPaginationLinks'
        meta:
          $ref: '#/components/schemas/LaravelPaginationMeta'
    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Jane Doe
        phone_number:
          type: string
          nullable: true
          maxLength: 20
          example: '+491234567890'
        facebook_profile:
          type: string
          nullable: true
          maxLength: 255
          example: https://facebook.com/jane
        timezone:
          type: string
          nullable: true
          maxLength: 50
          example: Europe/Berlin
        password:
          type: string
          nullable: true
          minLength: 8
          format: password
          example: new-password
        password_confirmation:
          type: string
          nullable: true
          format: password
          example: new-password
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 255
          example: jane@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: password123
        password_confirmation:
          type: string
          format: password
          example: password123
        phone_number:
          type: string
          nullable: true
          maxLength: 20
          example: '+491234567890'
        facebook_profile:
          type: string
          nullable: true
          maxLength: 255
          example: https://facebook.com/jane
    SocialLoginRequest:
      type: object
      required: [provider, provider_id, name, email]
      properties:
        provider:
          type: string
          enum: [google]
          example: google
        provider_id:
          type: string
          example: '10987654321'
        name:
          type: string
          maxLength: 255
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        profile_image:
          type: string
          nullable: true
          example: https://example.com/avatar.jpg
    Trip:
      type: object
      required:
        - id
        - from_city
        - to_city
        - user
        - departure_date
        - arrival_date
        - weight_available
        - weight_price
      properties:
        id:
          type: integer
          example: 10
        from_city:
          $ref: '#/components/schemas/City'
        to_city:
          $ref: '#/components/schemas/City'
        user:
          $ref: '#/components/schemas/User'
        departure_date:
          type: string
          format: date
          example: 2026-06-15
        arrival_date:
          type: string
          format: date
          example: 2026-06-16
        airline:
          type: string
          nullable: true
          example: Lufthansa
        notes:
          type: string
          nullable: true
          example: Can carry fragile items with proper packaging.
        weight_available:
          type: string
          example: '5'
        weight_price:
          type: string
          example: EUR 12/kg
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    TripCreateRequest:
      type: object
      required:
        - from_city_id
        - to_city_id
        - departure_date
        - arrival_date
        - weight_available
        - weight_price
      properties:
        from_city_id:
          type: integer
          example: 1
        to_city_id:
          type: integer
          example: 2
        departure_date:
          type: string
          format: date
          example: 2026-06-15
        arrival_date:
          type: string
          format: date
          example: 2026-06-16
        weight_available:
          type: number
          minimum: 0.1
          example: 5
        weight_price:
          type: string
          maxLength: 255
          example: EUR 12/kg
        airline:
          type: string
          nullable: true
          maxLength: 255
          example: Lufthansa
        notes:
          type: string
          nullable: true
          maxLength: 1000
          example: Can carry fragile items with proper packaging.
    TripMutationResponse:
      type: object
      required: [message, trip]
      properties:
        message:
          type: string
          example: Trip created successfully.
        trip:
          $ref: '#/components/schemas/Trip'
    TripUpdateRequest:
      type: object
      properties:
        from_city_id:
          type: integer
          example: 1
        to_city_id:
          type: integer
          example: 2
        departure_date:
          type: string
          format: date
          example: 2026-06-15
        arrival_date:
          type: string
          format: date
          example: 2026-06-16
        weight_available:
          type: number
          minimum: 0.1
          example: 5
        weight_price:
          type: string
          maxLength: 255
          example: EUR 12/kg
        airline:
          type: string
          nullable: true
          maxLength: 255
          example: Lufthansa
        notes:
          type: string
          nullable: true
          maxLength: 1000
          example: Updated trip notes.
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        phone_number:
          type: string
          nullable: true
          example: '+491234567890'
        facebook_profile:
          type: string
          nullable: true
          example: https://facebook.com/jane
        profile_image:
          type: string
          nullable: true
          example: https://example.com/avatar.jpg
        timezone:
          type: string
          nullable: true
          example: Europe/Berlin
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.
